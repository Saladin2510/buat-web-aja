<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mental Health - Mind Space</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-pink': '#FF4081',
                        'brand-white': '#FFF5F8',
                    },
                    fontFamily: {
                        'playfair': ['"Playfair Display"', 'serif'],
                        'inter': ['"Inter"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-brand-pink text-brand-white font-inter antialiased min-h-screen flex flex-col overflow-x-hidden">

    <nav class="w-full py-8 flex justify-center gap-6 md:gap-12 font-playfair text-lg md:text-xl z-20 relative">
        <a href="#" class="border-b border-brand-white pb-1">Beranda</a>
        <a href="#" class="hover:border-b hover:border-brand-white pb-1 transition-all">Tentang</a>
        <a href="#" class="hover:border-b hover:border-brand-white pb-1 transition-all">Isi</a>
        <a href="#" class="hover:border-b hover:border-brand-white pb-1 transition-all">Hubungi</a>
    </nav>

    <section class="relative flex-grow flex items-center justify-center w-full px-6 md:px-20 py-10 min-h-[80vh]">
        
        <h1 class="absolute top-4 left-6 md:top-10 md:left-20 text-6xl md:text-[8rem] font-playfair font-bold leading-none z-0 tracking-widest drop-shadow-sm">
            MENTAL
        </h1>
        
        <h1 class="absolute top-1/2 right-2 md:right-10 -translate-y-1/2 text-6xl md:text-[8rem] font-playfair font-bold leading-none z-0 tracking-widest drop-shadow-sm" style="writing-mode: vertical-rl; text-orientation: mixed;">
            HEALTH
        </h1>

        <div class="relative w-64 h-96 md:w-[26rem] md:h-[38rem] z-10 overflow-hidden mix-blend-luminosity hover:mix-blend-normal transition-all duration-500">
            
            <img id="hero-img-1" src="https://images.unsplash.com/photo-1492684223066-81342ee5ff30?q=80&w=800&auto=format&fit=crop" alt="Hands holding light" class="absolute inset-0 w-full h-full object-cover transition-opacity duration-1000 ease-in-out opacity-100">
            
            <img id="hero-img-2" src="https://images.unsplash.com/photo-1506126613408-eca07ce68773?q=80&w=800&auto=format&fit=crop" alt="Calm mental space" class="absolute inset-0 w-full h-full object-cover transition-opacity duration-1000 ease-in-out opacity-0">
            
            <img id="hero-img-3" src="https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?q=80&w=800&auto=format&fit=crop" alt="Abstract warmth" class="absolute inset-0 w-full h-full object-cover transition-opacity duration-1000 ease-in-out opacity-0">
            
        </div>

        <div class="absolute bottom-10 left-6 md:left-20 flex flex-col items-start gap-2 z-10">
            <div class="w-6 h-6 md:w-8 md:h-8 bg-brand-white rounded-full shadow-sm"></div>
            <p class="font-playfair text-lg md:text-2xl leading-tight font-semibold mt-1">High<br>Cortisol.</p>
        </div>

    </section>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const images = [
                document.getElementById('hero-img-1'),
                document.getElementById('hero-img-2'),
                document.getElementById('hero-img-3')
            ];
            
            let currentIndex = 0;

            setInterval(() => {
                // Fade out current image
                images[currentIndex].classList.remove('opacity-100');
                images[currentIndex].classList.add('opacity-0');
                
                // Move to next image index
                currentIndex = (currentIndex + 1) % images.length;
                
                // Fade in next image
                images[currentIndex].classList.remove('opacity-0');
                images[currentIndex].classList.add('opacity-100');
            }, 3500); // Transisi setiap 3.5 detik
        });
    </script>
</body>
</html>
