<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mental Health - Mind Space</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-pink': '#FF4081',
                        'brand-white': '#FFF5F8',
                    },
                    fontFamily: {
                        'playfair': ['"Playfair Display"', 'serif'],
                        'inter': ['"Inter"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-brand-pink text-brand-white font-inter antialiased min-h-screen overflow-x-hidden">

    <section class="relative w-full h-screen overflow-hidden flex flex-col">
        
        <div class="absolute inset-0 z-0 bg-brand-pink">
            <img id="hero-img-1" src="assets/hero-img-1.png" alt="Hero 1" class="absolute inset-0 w-full h-full object-cover transition-opacity duration-1000 ease-in-out opacity-100">
            <img id="hero-img-2" src="assets/hero-img-2.png" alt="Hero 2" class="absolute inset-0 w-full h-full object-cover transition-opacity duration-1000 ease-in-out opacity-0">
            <img id="hero-img-3" src="assets/hero-img-3.png" alt="Hero 3" class="absolute inset-0 w-full h-full object-cover transition-opacity duration-1000 ease-in-out opacity-0">
            
            <div class="absolute inset-0 bg-black/10 pointer-events-none"></div>
        </div>

        <nav class="relative z-20 w-full py-8 flex justify-center gap-6 md:gap-12 font-playfair text-lg md:text-xl drop-shadow-md">
            <a href="#" class="border-b border-brand-white pb-1">Beranda</a>
            <a href="#" class="hover:border-b hover:border-brand-white pb-1 transition-all">Tentang</a>
            <a href="#" class="hover:border-b hover:border-brand-white pb-1 transition-all">Isi</a>
            <a href="#" class="hover:border-b hover:border-brand-white pb-1 transition-all">Hubungi</a>
        </nav>

        <div class="relative z-10 flex-grow pointer-events-none">
            
            <h1 class="absolute top-4 left-6 md:top-10 md:left-20 text-6xl md:text-[8rem] font-playfair font-bold leading-none tracking-widest drop-shadow-lg">
                MENTAL
            </h1>
            
            <h1 class="vertical-text absolute top-1/2 right-2 md:right-10 -translate-y-1/2 text-6xl md:text-[8rem] font-playfair font-bold leading-none tracking-widest drop-shadow-lg">
                HEALTH
            </h1>

            <div class="absolute bottom-10 left-6 md:left-20 flex flex-col items-start gap-2 pointer-events-auto">
                <div class="w-6 h-6 md:w-8 md:h-8 bg-brand-white rounded-full shadow-sm"></div>
                <p class="font-playfair text-lg md:text-2xl leading-tight font-semibold mt-1 drop-shadow-md">High<br>Cortisol.</p>
            </div>
            
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
